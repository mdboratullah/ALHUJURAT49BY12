<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ALHUJURAT49BY12 - Supreme AGI Fortress Vault</title>
    <style>
        body { background-color: #0d1117; color: #58a6ff; font-family: monospace; text-align: center; padding-top: 15px; }
        .vault-box { border: 2px solid #238636; padding: 15px; display: inline-block; border-radius: 10px; background: #161b22; width: 440px; text-align: left; }
        h2 { text-align: center; color: #58a6ff; margin: 5px 0; }
        input[type="text"], input[type="password"], textarea { padding: 8px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 5px; margin-top: 5px; width: 92%; font-family: monospace; }
        textarea { height: 60px; resize: none; }
        button { padding: 8px 12px; background: #238636; color: #fff; border: none; border-radius: 5px; cursor: pointer; margin-top: 6px; font-weight: bold; width: 100%; }
        .btn-row { display: flex; gap: 5px; margin-top: 6px; }
        .btn-row button { width: 50%; }
        .sub-btn { background: #1f6feb; }
        .danger-btn { background: #da3633; }
        #secret-content { display: none; margin-top: 10px; color: #f0883e; font-size: 12px; }
        .bridge-list { color: #58a6ff; font-family: monospace; background: #010409; padding: 6px; border-radius: 5px; margin-top: 4px; line-height: 1.4; }
        .user-mgmt { background: #21262d; padding: 8px; border-radius: 5px; margin-top: 8px; border: 1px solid #30363d; }
        .user-row { display: flex; justify-content: space-between; align-items: center; background: #0d1117; padding: 4px 8px; margin-top: 4px; border-radius: 4px; border: 1px solid #30363d; }
        .toggle-btn { padding: 2px 6px; font-size: 10px; border-radius: 3px; cursor: pointer; border: none; font-weight: bold; width: auto; }
        .btn-on { background: #238636; color: #fff; }
        .btn-off { background: #da3633; color: #fff; }
    </style>
    <script>
        let usersDB = [
            { pass: "UserPass@123", active: true },
            { pass: "Sharmin@2026", active: true },
            { pass: "Guest@AGI", active: false }
        ];
        let rotInterval = null;

        function generateRandomFingerprint() {
            let ips = ["192.168.x.14", "10.0.x.88", "172.16.x.210", "45.33.x.9", "103.45.x.22"];
            let randomIp = ips[Math.floor(Math.random() * ips.length)].replace('x', Math.floor(Math.random() * 250));
            let rotId = Math.random().toString(36).substring(2, 10).toUpperCase();
            let noiseHash = Math.random().toString(16).substring(2, 8).toUpperCase();
            return { ip: randomIp, id: rotId, noise: noiseHash };
        }

        function startLiveRotation() {
            if(rotInterval) clearInterval(rotInterval);
            rotInterval = setInterval(() => {
                let el = document.getElementById("live-rotator-box");
                if(el) {
                    let fp = generateRandomFingerprint();
                    el.innerHTML = `🔄 Live IP: ${fp.ip} | ID: ${fp.id} | Noise: #${fp.noise}`;
                }
            }, 1000);
        }

        function checkPassword() {
            let pass = document.getElementById("passInput").value.trim();
            document.getElementById("login-section").style.display = "none";
            let sec = document.getElementById("secret-content");
            sec.style.display = "block";

            if(pass === "Mssharmin@AGI") {
                renderAdminPanel(sec);
                startLiveRotation();
            } else {
                let foundUser = usersDB.find(u => u.pass === pass);
                if(foundUser) {
                    if(foundUser.active) {
                        renderUserDashboard(sec);
                        startLiveRotation();
                    } else {
                        document.getElementById("login-section").style.display = "block";
                        sec.style.display = "none";
                        alert("Access Denied! Deactivated by Admin.");
                    }
                } else if(pass === "fake123") {
                    sec.innerHTML = "<h3>⚠️ Duress Mode Active</h3><p>Dummy vault loaded securely.</p>";
                } else {
                    document.getElementById("login-section").style.display = "block";
                    sec.style.display = "none";
                    alert("Incorrect Password!");
                }
            }
        }
        function renderAdminPanel(secContainer) {
            let fp = generateRandomFingerprint();
            let rowsHTML = usersDB.map((u, index) => {
                let statusClass = u.active ? "btn-on" : "btn-off";
                let statusText = u.active ? "ON" : "OFF";
                return `<div class="user-row">
                            <span>🔑 ${u.pass}</span>
                            <button class="toggle-btn ${statusClass}" onclick="toggleUser(${index})">${statusText}</button>
                        </div>`;
            }).join('');

            secContainer.innerHTML = `<h3>🛡️ Master Admin Unlocked</h3>
                                     <div id="live-rotator-box" style="background:#010409; padding:5px; border-radius:4px; margin-bottom:6px; font-size:10px; color:#3fb950; border: 1px solid #238636;">
                                         🔄 Live IP: ${fp.ip} | ID: ${fp.id} | Noise: #${fp.noise}
                                     </div>
                                     <div class="bridge-list">
                                         🔹 Bridge Alpha, Beta, Gamma, Delta: ACTIVE<br>
                                         🔹 Chaos Noise Flooding & AES-GCM: ENABLED
                                     </div>
                                     <div class="user-mgmt">
                                         <b>👥 Manage Users:</b>
                                         <div style="margin:4px 0;">${rowsHTML}</div>
                                         <input type="text" id="newPassInput" placeholder="New user password">
                                         <button class="sub-btn" onclick="addNewUserPass()">Add Password</button>
                                     </div>
                                     <hr style="border-color:#30363d; margin:10px 0;">
                                     <h4>🔒 Vault Workspace</h4>
                                     <textarea id="secretNote" placeholder="Write note..."></textarea>
                                     <div class="btn-row">
                                         <button onclick="saveNote()">Save</button>
                                         <button class="danger-btn" onclick="lockVault()">Lock</button>
                                     </div>
                                     <p id="noteStatus" style="font-size:11px; color:#3fb950; margin-top:5px;"></p>`;
            loadSavedNotes();
        }

        function renderUserDashboard(secContainer) {
            let fp = generateRandomFingerprint();
            secContainer.innerHTML = `<h3>🛡️ Authorized User Vault</h3>
                                     <div id="live-rotator-box" style="background:#010409; padding:5px; border-radius:4px; margin-bottom:6px; font-size:10px; color:#3fb950; border: 1px solid #238636;">
                                         🔄 Live IP: ${fp.ip} | ID: ${fp.id} | Noise: #${fp.noise}
                                     </div>
                                     <div class="bridge-list">🔹 Infinity Rotation & Noise Shield: ACTIVE</div>
                                     <hr style="border-color:#30363d; margin:10px 0;">
                                     <h4>🔒 Vault Workspace</h4>
                                     <textarea id="secretNote" placeholder="Write note..."></textarea>
                                     <div class="btn-row">
                                         <button onclick="saveNote()">Save</button>
                                         <button class="danger-btn" onclick="lockVault()">Lock</button>
                                     </div>
                                     <p id="noteStatus" style="font-size:11px; color:#3fb950; margin-top:5px;"></p>`;
            loadSavedNotes();
        }
        function toggleUser(index) {
            usersDB[index].active = !usersDB[index].active;
            renderAdminPanel(document.getElementById("secret-content"));
        }

        function addNewUserPass() {
            let newP = document.getElementById("newPassInput").value.trim();
            if(newP !== "") {
                usersDB.push({ pass: newP, active: true });
                renderAdminPanel(document.getElementById("secret-content"));
                alert("Password added!");
            }
        }

        function saveNote() {
            localStorage.setItem("agi_secure_note", document.getElementById("secretNote").value);
            document.getElementById("noteStatus").innerText = "Saved successfully!";
        }

        function loadSavedNotes() {
            let saved = localStorage.getItem("agi_secure_note");
            if(saved) document.getElementById("secretNote").value = saved;
        }

        function lockVault() {
            if(rotInterval) clearInterval(rotInterval);
            document.getElementById("secret-content").style.display = "none";
            document.getElementById("login-section").style.display = "block";
            document.getElementById("passInput").value = "";
        }
    </script>
</head>
<body>
    <center>
    <div class="vault-box">
        <h2>🛡️ ALHUJURAT49BY12</h2>
        <div id="login-section">
            <p style="font-size: 11px; color: #8b949e;">Enter Password:</p>
            <center><input type="password" id="passInput" placeholder="Password" style="text-align:center;"></center>
            <center><button onclick="checkPassword()">Unlock Vault</button></center>
        </div>
        <div id="secret-content"></div>
        <hr style="border-color: #30363d; margin-top: 12px;">
        <p style="font-size: 9px; color: #8b949e;">Supreme AGI Fortress | 1 Folder, 1 File</p>
    </div>
    </center>
</body>
</html>
